<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- top tag: what you asked -->
  <g>
    <rect x="250" y="52" width="300" height="60" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="79" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700" letter-spacing="0.5">YOU ASKED ABOUT</text>
    <text x="400" y="100" text-anchor="middle" font-size="17" fill="#1e3a8a" font-weight="700">drug X &#183; rituximab</text>
  </g>

  <!-- attribution arrow (evidence stamped onto X) -->
  <path d="M400 210 L400 120" fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M400 116 l-8 14 l16 0 z" fill="#e74c3c"/>
  <text x="416" y="170" font-size="13" fill="#e74c3c" font-weight="600">attributed to X</text>

  <!-- central evidence card -->
  <g filter="url(#shadow)">
    <rect x="230" y="210" width="340" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="256" y="244" font-size="12" fill="#94a3b8" font-weight="700" letter-spacing="1">RETRIEVED EVIDENCE</text>

  <!-- citation chip -->
  <rect x="256" y="258" width="168" height="30" rx="7" fill="#fef9c3"/>
  <text x="270" y="279" font-size="16" fill="#854d0e" font-weight="700" font-family="monospace">NCT03188666</text>

  <!-- green check: passes every check -->
  <circle cx="524" cy="273" r="20" fill="#16a34a"/>
  <path d="M514 273 l7 7 l13 -15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- text lines -->
  <rect x="256" y="306" width="288" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="256" y="324" width="248" height="9" rx="4.5" fill="#e2e8f0"/>
  <rect x="256" y="342" width="180" height="9" rx="4.5" fill="#e2e8f0"/>

  <!-- bottom reveal: it is really about Y -->
  <g>
    <rect x="212" y="416" width="376" height="52" rx="13" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="400" y="440" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="700" letter-spacing="0.4">BUT THE TRIAL STUDIED</text>
    <text x="400" y="459" text-anchor="middle" font-size="16" fill="#991b1b" font-weight="700">drug Y &#183; garetosmab</text>
  </g>

  <!-- link from card down to Y -->
  <path d="M400 380 L400 416" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <circle cx="400" cy="380" r="3.5" fill="#f87171"/>
</svg>
