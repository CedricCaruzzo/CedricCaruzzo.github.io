<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="program-title program-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="program-title">Mixture-of-experts routing research program</title>
  <desc id="program-desc">A four-stage research chain from routing changes through residual exposure and correspondence geometry to behavioral verification.</desc>
  <defs>
    <linearGradient id="program-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="program-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="program-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#program-bg)"/>

  <g>
    <rect x="238" y="43" width="324" height="50" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="64" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700" letter-spacing="1.2">MOE ROUTING RESEARCH PROGRAM</text>
    <text x="400" y="83" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">From router motion to behavioral evidence</text>
  </g>

  <path d="M196 246 H232 M374 246 H410 M552 246 H588" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#program-arrow)"/>

  <!-- Stage 1: routing change -->
  <g filter="url(#program-shadow)">
    <rect x="38" y="145" width="158" height="202" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <circle cx="117" cy="178" r="18" fill="#dbeafe"/>
  <text x="117" y="184" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="800">1</text>
  <circle cx="70" cy="239" r="7" fill="#1e3a8a"/>
  <path d="M77 236 C96 214 110 214 129 226 M77 242 C97 264 110 268 129 257" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <rect x="130" y="216" width="28" height="20" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="130" y="248" width="28" height="20" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M77 237 C97 244 111 244 129 229" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"/>
  <text x="117" y="299" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">Routing change</text>
  <text x="117" y="319" text-anchor="middle" font-size="11.5" fill="#64748b">What moved?</text>

  <!-- Stage 2: residual exposure -->
  <g filter="url(#program-shadow)">
    <rect x="216" y="145" width="158" height="202" rx="17" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <circle cx="295" cy="178" r="18" fill="#ffedd5"/>
  <text x="295" y="184" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="800">2</text>
  <path d="M247 238 H342" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
  <path d="M247 238 H309" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
  <path d="M295 215 V260" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M286 222 L295 213 L304 222" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="295" y="277" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="750">Δ residual</text>
  <text x="295" y="299" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">Residual exposure</text>
  <text x="295" y="319" text-anchor="middle" font-size="11.5" fill="#64748b">What reaches the stream?</text>

  <!-- Stage 3: correspondence geometry -->
  <g filter="url(#program-shadow)">
    <rect x="394" y="145" width="158" height="202" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  </g>
  <circle cx="473" cy="178" r="18" fill="#ede9fe"/>
  <text x="473" y="184" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="800">3</text>
  <path d="M433 263 V215 M433 263 H515" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M439 255 L462 235 L481 243 L507 219" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="462" cy="235" r="5" fill="#a78bfa"/>
  <circle cx="481" cy="243" r="5" fill="#a78bfa"/>
  <circle cx="507" cy="219" r="5" fill="#7c3aed"/>
  <text x="473" y="299" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">Correspondence</text>
  <text x="473" y="317" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">geometry</text>
  <text x="473" y="334" text-anchor="middle" font-size="11.5" fill="#64748b">Which directions?</text>

  <!-- Stage 4: behavioral verification -->
  <g filter="url(#program-shadow)">
    <rect x="572" y="145" width="190" height="202" rx="17" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <circle cx="667" cy="178" r="18" fill="#dcfce7"/>
  <text x="667" y="184" text-anchor="middle" font-size="15" fill="#15803d" font-weight="800">4</text>
  <rect x="620" y="214" width="94" height="55" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <path d="M634 243 L647 255 L669 228" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M681 231 H702 M681 244 H699 M681 257 H694" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
  <text x="667" y="299" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">Behavioral</text>
  <text x="667" y="317" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="750">verification</text>
  <text x="667" y="334" text-anchor="middle" font-size="11.5" fill="#64748b">Does behavior change?</text>

  <g>
    <rect x="123" y="393" width="554" height="66" rx="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="400" y="420" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="1">A SHARED EVIDENCE CHAIN</text>
    <text x="400" y="444" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="700">Measure each link before attributing behavioral influence</text>
  </g>
</svg>
