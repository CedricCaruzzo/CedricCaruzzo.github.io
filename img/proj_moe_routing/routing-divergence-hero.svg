<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="routing-title routing-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="routing-title">Routing divergence and residual exposure</title>
  <desc id="routing-desc">Two contexts pass through the same mixture-of-experts weights, followed by an exact routing and content decomposition and a residual-exposure measurement.</desc>
  <defs>
    <linearGradient id="routing-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="routing-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="routing-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#routing-bg)"/>

  <g>
    <rect x="236" y="42" width="328" height="52" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="400" y="64" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700" letter-spacing="1.1">SAME WEIGHTS · TWO CONTEXTS</text>
    <text x="400" y="84" text-anchor="middle" font-size="15" fill="#1e3a8a" font-weight="700">What does routing divergence expose?</text>
  </g>

  <!-- shared model, two contexts -->
  <g filter="url(#routing-shadow)">
    <rect x="42" y="146" width="218" height="220" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <text x="151" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.9">SHARED MOE BLOCK</text>
  <rect x="61" y="197" width="72" height="34" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="97" y="219" text-anchor="middle" font-size="13" fill="#1d4ed8" font-weight="700">context A</text>
  <rect x="61" y="280" width="72" height="34" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="97" y="302" text-anchor="middle" font-size="13" fill="#c2410c" font-weight="700">context B</text>
  <path d="M133 214 H158 M133 297 H158" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#routing-arrow)"/>
  <rect x="163" y="207" width="72" height="96" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="199" cy="229" r="12" fill="#0f172a"/>
  <text x="199" y="234" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="800">W</text>
  <path d="M181 262 C190 248 207 248 217 262 M181 277 C191 291 207 291 217 277" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="199" y="324" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="700">weights fixed</text>
  <path d="M260 256 H293" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#routing-arrow)"/>

  <!-- exact block decomposition -->
  <g filter="url(#routing-shadow)">
    <rect x="294" y="146" width="248" height="220" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  </g>
  <text x="418" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.9">EXACT BLOCK DECOMPOSITION</text>
  <rect x="322" y="207" width="192" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="418" y="234" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="750">Δ output = A + B</text>
  <rect x="322" y="267" width="91" height="64" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="367.5" y="291" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="800">A</text>
  <text x="367.5" y="313" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="700">routing</text>
  <rect x="423" y="267" width="91" height="64" rx="11" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="468.5" y="291" text-anchor="middle" font-size="21" fill="#ea580c" font-weight="800">B</text>
  <text x="468.5" y="313" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="700">content</text>
  <path d="M542 256 H575" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#routing-arrow)"/>

  <!-- residual exposure -->
  <g filter="url(#routing-shadow)">
    <rect x="576" y="146" width="182" height="220" rx="17" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <text x="667" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.8">RESIDUAL EXPOSURE</text>
  <circle cx="667" cy="257" r="55" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <path d="M626 271 C642 260 651 263 663 247 C676 229 688 237 708 216" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <path d="M626 285 H708" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="663" cy="247" r="5" fill="#15803d"/>
  <text x="667" y="333" text-anchor="middle" font-size="14" fill="#166534" font-weight="750">measure Δr</text>

  <g>
    <rect x="105" y="408" width="590" height="57" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="400" y="442" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="700">Separate router movement from the signal reaching behavior</text>
  </g>
</svg>
