<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="expert-title expert-desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="expert-title">Expert directions receiving moved gate mass</title>
  <desc id="expert-desc">Moved gate pairs over expert-output directions enter an exact relabeling orbit and factor into spectral capacity and directional utilization.</desc>
  <defs>
    <linearGradient id="expert-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="expert-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <marker id="expert-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="mass-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#expert-bg)"/>

  <g>
    <rect x="204" y="42" width="392" height="52" rx="13" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="64" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700" letter-spacing="1.1">EXACT CORRESPONDENCE REFERENCE</text>
    <text x="400" y="84" text-anchor="middle" font-size="15" fill="#4c1d95" font-weight="700">Which expert directions receive moved gate mass?</text>
  </g>

  <!-- moved gate pairs -->
  <g filter="url(#expert-shadow)">
    <rect x="36" y="146" width="227" height="220" rx="17" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <text x="149.5" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.8">MOVED GATE MASS</text>
  <text x="73" y="201" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-weight="700">BEFORE</text>
  <text x="221" y="201" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-weight="700">AFTER</text>
  <circle cx="73" cy="230" r="13" fill="#dbeafe" stroke="#60a5fa"/>
  <circle cx="73" cy="273" r="13" fill="#dbeafe" stroke="#60a5fa"/>
  <circle cx="73" cy="316" r="13" fill="#dbeafe" stroke="#60a5fa"/>
  <circle cx="221" cy="230" r="13" fill="#ede9fe" stroke="#a78bfa"/>
  <circle cx="221" cy="273" r="13" fill="#ede9fe" stroke="#a78bfa"/>
  <circle cx="221" cy="316" r="13" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="73" y="235" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="800">E&#8321;</text>
  <text x="73" y="278" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="800">E&#8322;</text>
  <text x="73" y="321" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="800">E&#8323;</text>
  <text x="221" y="235" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="800">E&#8321;</text>
  <text x="221" y="278" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="800">E&#8322;</text>
  <text x="221" y="321" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="800">E&#8323;</text>
  <path d="M88 230 C127 218 163 218 206 230" fill="none" stroke="#3b82f6" stroke-width="3" marker-end="url(#mass-arrow)"/>
  <path d="M88 273 C127 273 166 273 206 273" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#mass-arrow)"/>
  <path d="M88 316 C130 324 164 246 206 237" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#mass-arrow)"/>
  <text x="149.5" y="346" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="650">gate pairs &#215; output directions</text>
  <path d="M263 256 H296" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#expert-arrow)"/>

  <!-- exact relabeling/orbit -->
  <g filter="url(#expert-shadow)">
    <rect x="297" y="146" width="206" height="220" rx="17" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  </g>
  <text x="400" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.8">EXACT REFERENCE</text>
  <circle cx="400" cy="263" r="61" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="400" cy="263" r="23" fill="#7c3aed"/>
  <text x="400" y="270" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="800">C</text>
  <circle cx="400" cy="213" r="9" fill="#c4b5fd"/>
  <circle cx="443" cy="286" r="9" fill="#a78bfa"/>
  <circle cx="357" cy="286" r="9" fill="#8b5cf6"/>
  <path d="M411 213 A52 52 0 0 1 449 276" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#expert-arrow)"/>
  <path d="M435 297 A52 52 0 0 1 366 297" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#expert-arrow)"/>
  <path d="M351 276 A52 52 0 0 1 389 213" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#expert-arrow)"/>
  <text x="400" y="346" text-anchor="middle" font-size="12.5" fill="#5b21b6" font-weight="750">relabeling orbit</text>
  <path d="M503 256 H536" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#expert-arrow)"/>

  <!-- capacity x utilization -->
  <g filter="url(#expert-shadow)">
    <rect x="537" y="146" width="227" height="220" rx="17" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <text x="650.5" y="174" text-anchor="middle" font-size="12" fill="#64748b" font-weight="700" letter-spacing="0.8">CORRESPONDENCE GEOMETRY</text>
  <rect x="566" y="207" width="169" height="51" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="650.5" y="240" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="750">R<tspan baseline-shift="sub" font-size="13">C</tspan> = &#923; &#215; U</text>
  <rect x="566" y="277" width="72" height="62" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="602" y="302" text-anchor="middle" font-size="21" fill="#2563eb" font-weight="800">&#923;</text>
  <text x="602" y="322" text-anchor="middle" font-size="10.5" fill="#1e40af" font-weight="700">capacity</text>
  <text x="650.5" y="313" text-anchor="middle" font-size="18" fill="#94a3b8" font-weight="700">&#215;</text>
  <rect x="663" y="277" width="72" height="62" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="699" y="302" text-anchor="middle" font-size="21" fill="#15803d" font-weight="800">U</text>
  <text x="699" y="322" text-anchor="middle" font-size="10.5" fill="#166534" font-weight="700">utilization</text>

  <g>
    <rect x="91" y="408" width="618" height="57" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="400" y="442" text-anchor="middle" font-size="16" fill="#0f172a" font-weight="700">Where can moved mass point&#8212;and which directions does it use?</text>
  </g>
</svg>
